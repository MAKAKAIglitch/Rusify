name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and package with the repository wrapper
        run: ./gradlew build --no-daemon --build-cache

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Rusify-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

  validate-windows-builder:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          $files = @("$PWD\scripts\build.ps1", "$PWD\scripts\update-sources.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              exit 1
            }
            Write-Host "PowerShell syntax is valid: $file"
          }
